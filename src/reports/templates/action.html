<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recovery Probe action check</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }
      td,
      th {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>{{heading}}</h1>
    <p>{{limitation}}</p>
    <table>
      <tr>
        <th>Check</th>
        <th>Finding</th>
        <th>Kind</th>
        <th>Advice</th>
      </tr>
      {{{findings}}}
    </table>
    <h2>Runs</h2>
    <table>
      <tr>
        <th>Run</th>
        <th>Requests</th>
        <th>Screen changes</th>
        <th>Uncaught errors</th>
      </tr>
      {{{runs}}}
    </table>
    <p>Final reload: {{finalReset}}</p>
    <h2>Evidence</h2>
    <pre>{{evidence}}</pre>
  </body>
</html>
