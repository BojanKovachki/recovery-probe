name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Verify guided setup choices and argument handling
        run: node --test test/guided-start.test.mjs
      - name: Verify fetch engine
        run: npm run test:core
      - name: Verify isolated package installation and TypeScript imports
        run: npm run test:package
      - name: Verify IPC registration and fault isolation
        run: npm run test:ipc
      - name: Verify desktop configuration and report handling
        run: npm run test:desktop
      - name: Verify repair safety and provider contract
        run: node --test test/repair.test.mjs
      - name: Verify package contents
        run: npm pack --dry-run

  windows-package:
    name: Windows publish (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify guided setup choices and argument handling
        run: node --test test/guided-start.test.mjs
      # npm publish --dry-run can reject a version already on npm, including
      # the tag-triggered run after a successful release. Keep these checks local.
      - name: Verify publication checks
        run: npm run prepublishOnly
      - name: Verify package contents without uploading
        run: npm pack --dry-run

  windows-repair:
    name: Windows repair pipeline
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install chromium
      - name: Verify the isolated repair pipeline with Git for Windows defaults (mock model)
        run: npm run test:repair

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    # Installing system packages on the runner sometimes takes 10 minutes on its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run controlled fetch demonstration
        run: npm run demo
      - name: Verify browser adapter
        run: npm run test:browser
      - name: Measure synthetic observation sampling (diagnostic, no timing threshold)
        run: node scripts/benchmark-observe.mjs > artifacts/observe-benchmark.json
      - name: Verify authenticated web workflow and isolated repair pipeline (mock model)
        run: npm run test:repair
      - name: Verify guided setup, content selection and saved reruns
        run: node --test test/guided-start.integration.test.mjs
      - name: Run controlled browser demonstration
        run: npm run demo:browser
      - name: Verify the runnable CI recovery example
        run: npm run test:ci-example
      - name: Upload demonstration reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recovery-probe-demo-reports
          path: |
            artifacts/*.json
            artifacts/ci-example-*/
          if-no-files-found: warn

  electron:
    name: Electron ${{ matrix.electron }} desktop recovery
    strategy:
      fail-fast: false
      matrix:
        electron: ['29.0.1', '44.5.1']
    runs-on: ubuntu-latest
    # Installing system packages on the runner sometimes takes 10 minutes on its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Electron test runtime
        run: npm install --no-save --package-lock=false --no-audit --no-fund electron@${{ matrix.electron }}
      - name: Test discovery, recovery checks and CLI in real Electron
        run: xvfb-run -a npm run test:desktop:electron
      - name: Install window manager for native minimize/restore validation
        run: sudo apt-get update && sudo apt-get install -y openbox
      - name: Test IPC rejection, null result, dependencies and cleanup
        run: xvfb-run -a sh -c 'openbox >/tmp/recovery-probe-openbox.log 2>&1 & npm run test:ipc:electron'
      - name: Test real Electron before/after repair with a controlled model proposal
        run: xvfb-run -a npm run test:repair:electron
