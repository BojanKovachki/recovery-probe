name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Verify isolated package installation and TypeScript imports
        run: npm run test:package
      - name: Verify package contents
        run: npm pack --dry-run

  windows-package:
    name: Windows publish (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      # npm publish --dry-run can reject a version already on npm, including
      # the tag-triggered run after a successful release. Keep these checks local.
      - name: Verify publication checks
        run: npm run prepublishOnly
      - name: Verify package contents without uploading
        run: npm pack --dry-run

  windows-repair:
    name: Windows repair pipeline
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install chromium
      - name: Verify the isolated repair pipeline with Git for Windows defaults (mock model)
        run: npm run test:repair

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    # Installing system packages on the runner sometimes takes 10 minutes on its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run controlled fetch demonstration
        run: npm run demo
      - name: Integration tests in Chromium
        run: npm run test:integration
      - name: Measure synthetic observation sampling (diagnostic, no timing threshold)
        run: node scripts/benchmark-observe.mjs > artifacts/observe-benchmark.json
      - name: Run controlled browser demonstration
        run: npm run demo:browser
      - name: Verify the runnable CI recovery example
        run: npm run test:ci-example
      - name: Upload demonstration reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recovery-probe-demo-reports
          path: |
            artifacts/*.json
            artifacts/ci-example-*/
            .recovery-probe/demo-*/
          # The demo report folder starts with a dot.
          include-hidden-files: true
          if-no-files-found: warn

  electron:
    name: Electron ${{ matrix.electron }} desktop recovery
    strategy:
      fail-fast: false
      matrix:
        electron: ['29.0.1', '44.5.1']
    runs-on: ubuntu-latest
    # Installing system packages on the runner sometimes takes 10 minutes on its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Electron test runtime
        run: npm install --no-save --package-lock=false --no-audit --no-fund electron@${{ matrix.electron }}
      - name: Install window manager for native minimize/restore validation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox
      - name: Electron tests
        run: xvfb-run -a sh -c 'openbox >/tmp/recovery-probe-openbox.log 2>&1 & npm run test:electron'
