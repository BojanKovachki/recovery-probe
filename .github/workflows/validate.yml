name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify guided setup choices and argument handling
        run: node --test test/guided-start.test.mjs
      - name: Verify fetch engine
        run: npm run test:core
      - name: Verify isolated package installation and TypeScript imports
        run: npm run test:package
      - name: Verify desktop configuration and report handling
        run: npm run test:desktop
      - name: Verify repair safety and provider contract
        run: node --test test/repair.test.mjs
      - name: Verify package contents
        run: npm pack --dry-run

  windows-package:
    name: Windows publish (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify guided setup choices and argument handling
        run: node --test test/guided-start.test.mjs
      - name: Verify publishing lifecycle without uploading
        run: npm publish --dry-run --tag next --access public

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run controlled fetch demonstration
        run: npm run demo
      - name: Verify browser adapter
        run: npm run test:browser
      - name: Verify authenticated web workflow and isolated repair pipeline (mock model)
        run: npm run test:repair
      - name: Verify guided setup, content selection and saved reruns
        run: node --test test/guided-start.integration.test.mjs
      - name: Run controlled browser demonstration
        run: npm run demo:browser
      - name: Upload demonstration reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recovery-probe-demo-reports
          path: artifacts/*.json
          if-no-files-found: warn

  electron:
    name: Electron ${{ matrix.electron }} desktop recovery
    strategy:
      fail-fast: false
      matrix:
        electron: ['29.0.1', '44.5.1']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron test runtime
        run: npm install --no-save --package-lock=false --no-audit --no-fund electron@${{ matrix.electron }}
      - name: Test discovery, recovery checks and CLI in real Electron
        run: xvfb-run -a npm run test:desktop:electron
      - name: Test real Electron before/after repair with a controlled model proposal
        run: xvfb-run -a npm run test:repair:electron
