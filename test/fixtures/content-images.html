<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content images fixture</title>
    <style>
      .background {
        width: 10px;
        height: 10px;
      }
    </style>
  </head>
  <body>
    <section id="cards"></section>
    <script>
      // A card with an <img> (600 ms) and a CSS background image (1200 ms) shows after 100 ms.
      // ?broken adds a card whose image fails; ?late=ms adds a card with its own image then;
      // ?lazy adds a card far below the fold whose image loads lazily.
      const params = new URLSearchParams(location.search)
      const cards = document.getElementById('cards')
      const card = (name, image, background) =>
        `<div data-card>${name}` +
        (image ? `<img src="${image}" alt="" />` : '') +
        (background
          ? `<div class="background" style="background-image: url('${background}')"></div>`
          : '') +
        '</div>'
      setTimeout(() => {
        cards.innerHTML =
          card('Ada', '/image/a?delay=600', '/image/b?delay=1200') +
          (params.has('broken') ? card('Grace', '/image/missing') : '') +
          (params.has('lazy')
            ? '<div data-card style="margin-top: 10000px">Lazy' +
              '<img loading="lazy" src="/image/d" alt="" /></div>'
            : '')
      }, 100)
      if (params.has('late'))
        setTimeout(
          () =>
            cards.insertAdjacentHTML(
              'beforeend',
              card('Linus', '/image/c?delay=300'),
            ),
          Number(params.get('late')),
        )
    </script>
  </body>
</html>
