<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content images fixture</title>
    <style>
      .background {
        width: 10px;
        height: 10px;
      }
    </style>
  </head>
  <body>
    <section id="cards"></section>
    <script>
      // render() shows, 100 ms later, a card with an <img> (600 ms) and a CSS background image
      // (1200 ms). ?broken adds a card whose image fails; ?late=ms adds a card with its own image
      // that long after render(); ?lazy adds a card far below the fold whose image loads lazily.
      const params = new URLSearchParams(location.search)
      const cards = document.getElementById('cards')
      const card = (name, image, background) =>
        `<div data-card>${name}` +
        (image ? `<img src="${image}" alt="" />` : '') +
        (background
          ? `<div class="background" style="background-image: url('${background}')"></div>`
          : '') +
        '</div>'
      window.render = () => {
        setTimeout(() => {
          cards.innerHTML =
            card('Ada', '/image/a?delay=600', '/image/b?delay=1200') +
            (params.has('broken') ? card('Grace', '/image/missing') : '') +
            (params.has('lazy')
              ? '<div data-card style="margin-top: 10000px">Lazy' +
                '<img loading="lazy" src="/image/d" alt="" /></div>'
              : '')
          if (params.has('span')) exportLoadSpan(Date.now())
        }, 100)
        if (params.has('late'))
          setTimeout(
            () =>
              cards.insertAdjacentHTML(
                'beforeend',
                card('Linus', '/image/c?delay=300'),
              ),
            Number(params.get('late')),
          )
      }
      // ?span exports an OTLP span from the card showing until its images loaded, as an app's
      // load-time instrumentation would, plus a span the observation does not list.
      const loaded = (url) =>
        new Promise((resolve) => {
          const image = new Image()
          image.onload = image.onerror = resolve
          image.src = url
        })
      const nanos = (ms) => String(BigInt(ms) * 1000000n)
      const exportLoadSpan = async (start) => {
        await Promise.all([loaded('/image/a?delay=600'), loaded('/image/b?delay=1200')])
        const end = Date.now()
        const span = (name, attributes) => ({
          name,
          startTimeUnixNano: nanos(start),
          endTimeUnixNano: nanos(end),
          status: { code: 0 },
          attributes,
        })
        await fetch('/v1/traces', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            resourceSpans: [
              {
                scopeSpans: [
                  {
                    spans: [
                      span('LoadTime cards', [
                        { key: 'load_time.outcome', value: { stringValue: 'success' } },
                        { key: 'email', value: { stringValue: 'person@example.test' } },
                      ]),
                      span('other', []),
                    ],
                  },
                ],
              },
            ],
          }),
        })
      }
    </script>
  </body>
</html>
