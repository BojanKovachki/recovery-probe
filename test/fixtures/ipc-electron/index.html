<!doctype html><meta charset="utf-8"><title>IPC recovery fixture</title>
<p id="spinner">Loading</p><p id="row" hidden></p><p id="empty" hidden>Empty</p>
<script>
const mode = new URLSearchParams(location.search).get('mode');
const row = document.querySelector('#row');
const spinner = document.querySelector('#spinner');
const empty = document.querySelector('#empty');
async function load() {
  try {
    const versions = await fixtureApi.versions();
    let data;
    try { data = await fixtureApi.read(); }
    catch(error) {
      if (mode === 'broken') throw error;
      await new Promise(resolve => setTimeout(resolve, 30));
      data = await fixtureApi.read();
    }
    // A successful null result fails mapping outside the transport retry branch.
    row.textContent = data.name;
    row.hidden = false;
  } catch { empty.hidden = false; }
  finally { spinner.hidden = true; }
}
load();
</script>
