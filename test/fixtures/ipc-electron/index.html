<!doctype html><meta charset="utf-8"><title>IPC recovery fixture</title>
<h1>Library</h1><section id="grid"></section>
<p id="spinner">Loading</p><p id="row" role="listitem" hidden></p><p id="empty" hidden>Empty</p>
<p id="error" role="alert" hidden>Unable to load files. Try again.</p>
<div id="invite" hidden><input id="email" aria-label="Email"><button id="send" type="button">Send</button></div>
<p id="sent" hidden>Invitation sent</p><p id="send-error" role="alert" hidden>Could not send the invitation. Try again.</p>
<p id="send-toast" role="status" hidden>We couldn't send the invitation.</p>
<script>
const mode = new URLSearchParams(location.search).get('mode');
const gridMode = ['grid', 'delayed-control', 'delayed-baseline', 'unstable-baseline', 'empty-region'].includes(mode);
const reloadCount = Number(sessionStorage.getItem('fixtureReloads') ?? 0) + 1;
sessionStorage.setItem('fixtureReloads', String(reloadCount));
const row = document.querySelector('#row');
const spinner = document.querySelector('#spinner');
const empty = document.querySelector('#empty');
async function load() {
  try {
    const versions = await fixtureApi.versions();
    // two-reads prefetches and ignores a failure, then renders a second read without retrying it.
    if (mode === 'two-reads') await fixtureApi.read().catch(() => {});
    let data;
    try { data = await fixtureApi.read(); }
    catch(error) {
      if (mode === 'broken' || mode === 'refresh' || mode === 'two-reads' || gridMode) throw error;
      await new Promise(resolve => setTimeout(resolve, 30));
      data = await fixtureApi.read();
    }
    // A successful null result fails mapping outside the transport retry branch.
    if (data === null) throw Error('null');
    if (mode === 'delayed-control' && reloadCount === 4) { spinner.hidden = true; await new Promise(resolve => setTimeout(resolve, 1200)); }
    if (mode === 'delayed-baseline' || mode === 'unstable-baseline') { spinner.hidden = true; await new Promise(resolve => setTimeout(resolve, 600)); }
    const cards = mode === 'empty-region' ? 0 : mode === 'unstable-baseline' ? 12 + reloadCount % 2 : 13;
    if (gridMode) document.querySelector('#grid').innerHTML = Array.from({length:cards}, () => '<a href="#"><img width="12" height="12" alt="" src="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\'/%3E"></a>').join('');
    else { row.textContent = data.name; row.hidden = false; }
  } catch { if (mode === 'refresh') { row.hidden = true; empty.hidden = true; } else if (mode === 'honest') document.querySelector('#error').hidden = false; else if (!gridMode) empty.hidden = false; }
  finally { spinner.hidden = true; }
}
// Write forms for action checks: silent ignores failures, false-success never waits,
// honest shows an error and disables Send while the request is in flight, and toast
// shows a short-lived status message without error words.
function invite() {
  spinner.hidden = true;
  const form = document.querySelector('#invite');
  const send = document.querySelector('#send');
  const sent = document.querySelector('#sent');
  const sendError = document.querySelector('#send-error');
  const done = () => { form.hidden = true; sent.hidden = false; };
  form.hidden = false;
  send.addEventListener('click', async () => {
    const value = document.querySelector('#email').value;
    if (mode === 'form-false-success') { fixtureApi.write(value).catch(() => {}); done(); return; }
    if (mode === 'form-silent') { await fixtureApi.write(value); done(); return; }
    send.disabled = true; sendError.hidden = true;
    try { await fixtureApi.write(value); done(); }
    catch {
      if (mode !== 'form-toast') sendError.hidden = false;
      else { const toast = document.querySelector('#send-toast'); toast.hidden = false; setTimeout(() => { toast.hidden = true; }, 600); }
    }
    finally { send.disabled = false; }
  });
}
if (mode?.startsWith('form-')) invite(); else load();
if (mode === 'refresh' || mode === 'refresh-retry') window.addEventListener('online', () => load());
</script>
