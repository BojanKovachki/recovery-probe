<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">Recovery Probe demonstration</title>
  <desc id="description">A normal test passes for both applications. Recovery Probe catches three broken recovery paths and verifies the fixed application.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="24" fill="url(#background)"/>
  <circle cx="44" cy="38" r="6" fill="#fb7185"/>
  <circle cx="64" cy="38" r="6" fill="#fbbf24"/>
  <circle cx="84" cy="38" r="6" fill="#34d399"/>
  <text x="120" y="45" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">recovery-probe --demo</text>

  <text x="54" y="102" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">The happy path passes in both apps</text>
  <rect x="54" y="124" width="852" height="54" rx="12" fill="#16243d" stroke="#334155"/>
  <circle cx="83" cy="151" r="11" fill="#10b981"/>
  <path d="M78 151l4 4 7-8" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="158" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="18">Normal loading test</text>
  <text x="824" y="158" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">PASS</text>

  <text x="54" y="229" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Broken recovery</text>
  <text x="533" y="229" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Fixed recovery</text>

  <g filter="url(#shadow)">
    <rect x="54" y="247" width="373" height="156" rx="16" fill="#1b2034" stroke="#7f1d1d"/>
    <rect x="533" y="247" width="373" height="156" rx="16" fill="#132b2a" stroke="#166534"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">
    <circle cx="83" cy="281" r="10" fill="#e11d48"/>
    <path d="M79 277l8 8m0-8l-8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <text x="106" y="287" fill="#fecdd3">HTTP 503</text>
    <text x="338" y="287" fill="#fb7185" font-weight="700">CAUGHT</text>

    <circle cx="83" cy="325" r="10" fill="#e11d48"/>
    <path d="M79 321l8 8m0-8l-8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <text x="106" y="331" fill="#fecdd3">Connection failure</text>
    <text x="338" y="331" fill="#fb7185" font-weight="700">CAUGHT</text>

    <circle cx="83" cy="369" r="10" fill="#e11d48"/>
    <path d="M79 365l8 8m0-8l-8 8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <text x="106" y="375" fill="#fecdd3">Invalid JSON</text>
    <text x="338" y="375" fill="#fb7185" font-weight="700">CAUGHT</text>

    <circle cx="562" cy="281" r="10" fill="#10b981"/>
    <path d="M557 281l4 4 7-8" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="585" y="287" fill="#d1fae5">HTTP 503</text>
    <text x="832" y="287" fill="#6ee7b7" font-weight="700">PASS</text>

    <circle cx="562" cy="325" r="10" fill="#10b981"/>
    <path d="M557 325l4 4 7-8" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="585" y="331" fill="#d1fae5">Connection failure</text>
    <text x="832" y="331" fill="#6ee7b7" font-weight="700">PASS</text>

    <circle cx="562" cy="369" r="10" fill="#10b981"/>
    <path d="M557 369l4 4 7-8" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="585" y="375" fill="#d1fae5">Invalid JSON</text>
    <text x="832" y="375" fill="#6ee7b7" font-weight="700">PASS</text>
  </g>

  <path d="M447 325h58" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M497 316l10 9-10 9" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="444" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Same happy path. Different behavior under failure. Recovery Probe makes the difference visible.</text>
</svg>
